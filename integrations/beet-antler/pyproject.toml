[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[project]
name = "beet-antler"
version = "0.1.5"
description = "Build-and-sync integration between Beet and Antler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["beet>=0.116,<0.117"]

[project.urls]
Repository = "https://github.com/BlueFalconHD/antler"

[dependency-groups]
dev = [
  "basedpyright>=1.33",
  "pytest>=9.0",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
