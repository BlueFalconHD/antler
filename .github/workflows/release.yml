name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Verify tag and package version
        run: bun scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun run lint

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: antler-linux-x64
          - os: macos-latest
            target: macos-arm64
            artifact: antler-macos-arm64
          - os: macos-15-intel
            target: macos-x64
            artifact: antler-macos-x64
          - os: windows-latest
            target: windows
            artifact: antler-windows-x64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build:exe:${{ matrix.target }}
      - name: Smoke-test Unix executable
        if: runner.os != 'Windows'
        run: bun scripts/verify-executable-version.mjs ./dist/antler
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        run: bun scripts/verify-executable-version.mjs .\dist\antler.exe
      - name: Package Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          tar -C dist -czf release/${{ matrix.artifact }}.tar.gz antler
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/antler.exe -DestinationPath release/antler-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  beet:
    name: Build beet-antler
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/beet-antler
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: integrations/beet-antler
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: beet-antler-python
          path: integrations/beet-antler/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, beet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: antler-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: beet-antler-python
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum antler-* > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "Antler $GITHUB_REF_NAME"
          fi

  publish-beet:
    name: Publish beet-antler to PyPI
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: beet-antler-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
