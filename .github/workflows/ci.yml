name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Smoke-test Unix executable
        if: runner.os != 'Windows'
        run: bun scripts/verify-executable-version.mjs ./dist/antler
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        run: bun scripts/verify-executable-version.mjs .\dist\antler.exe

  beet:
    name: Check beet-antler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/beet-antler
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: integrations/beet-antler
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest
      - run: uv build
